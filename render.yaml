# =============================================================================
# TalkLedger — Render Blueprint Specification
# =============================================================================
# Architecture: Single-service monorepo deployment.
# Express server serves both /api/* routes and static production assets from client/dist.
# =============================================================================

services:
  - type: web
    name: talkledger
    runtime: node
    branch: master
    # Render Free Web Service (No credit card required, 750 free instance hours/month)
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # External Neon PostgreSQL Free database URL (Permanent free tier, no card required)
      # Configure this variable in the Render Dashboard with your Neon connection string:
      # e.g. postgresql://user:password@ep-xyz.neon.tech/talkledger?sslmode=require
      - key: DATABASE_URL
        sync: false

      # Google Gemma 2 AI Configuration (Groq LPU / Hugging Face) - Optional
      - key: GROQ_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma2-9b-it

      # Prior Labs TabPFN-3.5 API Token - Optional
      - key: TABPFN_API_KEY
        sync: false

# =============================================================================
# TalkLedger — Render Blueprint Specification
# =============================================================================
# Architecture: Single-service monorepo deployment.
# Express server serves both /api/* routes and static production assets from client/dist.
# =============================================================================

services:
  - type: web
    name: talkledger
    runtime: node
    branch: master
    # PLAN SELECTION NOTE:
    # Persistent disks (disk:) require Render's Starter plan ($7/mo instance + $0.25/GB/mo disk).
    # If deploying on Render Free Tier: Remove the 'disk' block below and set DATABASE_URL
    # to a free Render PostgreSQL database (or note that SQLite resets on container restart).
    plan: starter
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      # Production SQLite database path on mounted persistent disk:
      - key: DATABASE_URL
        value: file:/var/data/talkledger.db

      # Google Gemma 2 AI Configuration (Groq LPU / Hugging Face)
      - key: GROQ_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma2-9b-it

      # Prior Labs TabPFN-3.5 API Token (Optional)
      - key: TABPFN_API_KEY
        sync: false

    # Persistent disk for production SQLite database persistence across deploys:
    disk:
      name: talkledger-data
      mountPath: /var/data
      sizeGB: 1
